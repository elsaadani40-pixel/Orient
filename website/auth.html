<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12"><title>ORIENT ONE — الحساب</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#101722;--ink:#f3f6fb;--muted:#9caabd;--line:#253344;--mint:#83f2d0;--danger:#ff9b9b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0%,#183d4930,transparent 40%),linear-gradient(180deg,#080b12,#0a1019);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}.shell{width:min(100%,480px)}.brand{text-align:center;font-weight:850;letter-spacing:.18em;margin-bottom:22px}.panel{border:1px solid #ffffff1a;background:#101722df;border-radius:18px;padding:clamp(22px,6vw,36px)}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--mint);font-weight:750}.panel h1{font-size:28px;line-height:1.3;margin:8px 0}.muted{color:var(--muted);font-size:14px;margin:0 0 20px}.tabs{display:flex;gap:8px;margin:18px 0}.tab,.button{border:1px solid var(--line);border-radius:9px;padding:11px 14px;cursor:pointer;font:inherit}.tab{flex:1;background:#080d15;color:var(--ink)}.tab.active{border-color:var(--mint);color:var(--mint)}label{display:block;font-size:13px;margin:14px 0 6px}input{width:100%;background:#080d15;border:1px solid var(--line);border-radius:9px;padding:13px;color:var(--ink);font:inherit}input:focus{outline:2px solid #83f2d044;border-color:var(--mint)}.button{width:100%;margin-top:20px;background:var(--mint);color:#07120f;border-color:var(--mint);font-weight:800}.button:disabled{opacity:.6}.message{display:none;margin-top:14px;padding:10px;border:1px solid #ff9b9b55;border-radius:8px;color:var(--danger);font-size:13px}.message.show{display:block}.back{display:block;text-align:center;margin-top:18px;color:#b8c6d8;text-decoration:none;font-size:13px}.hint{font-size:12px;color:#8190a4;margin-top:16px}
</style></head>
<body><main class="shell"><div class="brand">◈ ORIENT ONE</div><section class="panel" aria-live="polite">
<div class="eyebrow" id="eyebrow">YOUR ORIENT ACCOUNT · حسابك</div><h1 id="heading">مرحبًا بك في ORIENT</h1><p class="muted" id="intro">أنشئ حسابك أو سجّل الدخول لمتابعة تجربتك.</p>
<div class="tabs" id="tabs"><button class="tab active" id="loginTab" type="button">تسجيل الدخول</button><button class="tab" id="registerTab" type="button">إنشاء حساب</button></div>
<form id="authForm"><label for="username">اسم المستخدم</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" required>
<label for="password">كلمة المرور</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<div id="confirmWrap" hidden><label for="confirmPassword">تأكيد كلمة المرور</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12"></div>
<button class="button" id="submit" type="submit">تسجيل الدخول</button></form><div id="message" class="message" role="status"></div>
<p class="hint" id="hint">الحساب العادي لا يملك صلاحيات إدارة الموقع.</p><p class="hint" id="ownerLink"><a href="/auth?mode=owner">مالك الموقع؟ دخول المالك</a></p></section><a class="back" href="/">العودة إلى الموقع ←</a></main>
<script>
(()=>{const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);let mode=params.get('mode')==='owner'?'owner':'login';
function render(){const owner=mode==='owner',register=mode==='register';$('tabs').hidden=owner;$('loginTab').classList.toggle('active',mode==='login');$('registerTab').classList.toggle('active',register);$('eyebrow').textContent=owner?'OWNER ACCESS · وصول المالك':'YOUR ORIENT ACCOUNT · حسابك';$('heading').textContent=owner?'دخول المالك':register?'إنشاء حساب جديد':'مرحبًا بك في ORIENT';$('intro').textContent=owner?'استخدم بيانات المالك. لا تمنح الحسابات العامة صلاحيات إدارية.':register?'أنشئ حسابًا شخصيًا للبدء. اسم المستخدم وكلمة المرور فقط في هذه المرحلة.':'سجّل الدخول إلى حسابك لمتابعة تجربتك.';$('confirmWrap').hidden=!register;$('confirmPassword').required=register;$('submit').textContent=owner?'دخول لوحة المالك':register?'إنشاء الحساب':'تسجيل الدخول';$('hint').textContent=owner?'الدخول محصور بحساب Admin المعتمد.': 'الحساب العادي لا يملك صلاحيات إدارة الموقع.';$('message').className='message';$('message').textContent=''}
function fail(text){$('message').textContent=text;$('message').className='message show'}
$('loginTab').onclick=()=>{mode='login';render()};$('registerTab').onclick=()=>{mode='register';render()};
$('authForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('submit');btn.disabled=true;try{const username=$('username').value.trim(),password=$('password').value;let endpoint,body;if(mode==='owner'){endpoint='/api/owner/login';body={username,password}}else if(mode==='register'){if(password.length<12)throw Error('استخدم كلمة مرور لا تقل عن 12 حرفًا.');if(password!==$('confirmPassword').value)throw Error('كلمتا المرور غير متطابقتين.');endpoint='/api/auth/register';body={username,password}}else{endpoint='/api/auth/login';body={username,password}}
const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'تعذر إكمال الطلب.');location.href=mode==='owner'?'/owner':'/';}catch(err){fail(err.message||'تعذر الاتصال بالخادم.')}finally{btn.disabled=false}});
if(mode==='owner'){$('username').value='Admin';$('username').autocomplete='username'}render();
})();
</script></body></html>
