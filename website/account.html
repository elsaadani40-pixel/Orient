<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><title>ORIENT ONE — حسابي</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#101722;--ink:#f3f6fb;--muted:#9caabd;--line:#253344;--mint:#83f2d0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0%,#183d4930,transparent 40%),var(--bg);color:var(--ink);font:16px/1.7 system-ui,sans-serif;display:grid;place-items:center;padding:20px}.shell{width:min(100%,560px)}.brand{text-align:center;font-weight:850;letter-spacing:.14em;margin-bottom:22px}.panel{border:1px solid #ffffff1a;background:var(--panel);border-radius:18px;padding:clamp(22px,6vw,36px)}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--mint);font-weight:800}.panel h1{font-size:30px;margin:8px 0}.muted{color:var(--muted)}.profile{display:flex;align-items:center;gap:15px;padding:16px;border:1px solid var(--line);border-radius:12px;margin:22px 0}.avatar{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#83f2d01a;color:var(--mint);font-size:22px}.name{font-weight:800}.role{font-size:13px;color:var(--muted)}label{display:block;font-size:13px;margin:14px 0 6px}input{width:100%;background:#080d15;border:1px solid var(--line);border-radius:9px;padding:12px;color:var(--ink);font:inherit}input:focus{outline:2px solid #83f2d044;border-color:var(--mint)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.btn{display:inline-block;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:11px 15px;background:#0a111a;color:var(--ink);font:inherit;cursor:pointer}.primary{background:var(--mint);color:#07120f;border-color:var(--mint);font-weight:800}.note{font-size:12px;color:var(--muted);margin-top:18px}
</style></head><body><main class="shell"><div class="brand">◈ ORIENT ONE</div><section class="panel"><div class="eyebrow">PERSONAL ACCOUNT · الحساب الشخصي</div><h1>أهلًا بك في مساحتك</h1><p class="muted">تم تسجيل الدخول. حسابك شخصي ولا يمتلك صلاحيات إدارة الموقع.</p><div class="profile"><div class="avatar">◈</div><div><div class="name" id="username">جارٍ تحميل الحساب…</div><div class="role">مستخدم ORIENT · صلاحيات عادية</div></div></div><form id="passwordForm" autocomplete="off"><h2>تغيير كلمة المرور</h2><label for="currentPassword">كلمة المرور الحالية</label><input id="currentPassword" type="password" autocomplete="current-password" minlength="12" maxlength="1024" required><label for="newPassword">كلمة المرور الجديدة</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required><label for="confirmPassword">تأكيد كلمة المرور الجديدة</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required><button class="btn primary" id="changePassword" type="submit">تحديث كلمة المرور</button><p class="note" id="passwordStatus" role="status" aria-live="polite"></p></form><div class="actions"><a class="btn" href="/">العودة إلى الموقع</a><button class="btn" id="logout" type="button">تسجيل الخروج</button></div><p class="note" id="status">بيانات الحساب الأساسية فقط متاحة في هذه المرحلة.</p></section></main>
<script>
(async()=>{const status=document.getElementById('status');try{const r=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});if(!r.ok){location.replace('/auth');return}const data=await r.json();if(data.role==='owner'){location.replace('/owner');return}document.getElementById('username').textContent=data.username;}catch{status.textContent='تعذر الاتصال بالخادم. حاول تحديث الصفحة.'}
document.getElementById('passwordForm').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('changePassword'),status=document.getElementById('passwordStatus');button.disabled=true;status.textContent='';try{const password=document.getElementById('newPassword').value,confirmPassword=document.getElementById('confirmPassword').value;if(password!==confirmPassword)throw Error('كلمتا المرور الجديدتان غير متطابقتين.');const r=await fetch('/api/auth/password',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:JSON.stringify({currentPassword:document.getElementById('currentPassword').value,password,confirmPassword})});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'تعذر تحديث كلمة المرور.');document.getElementById('passwordForm').reset();status.textContent='تم تحديث كلمة المرور بأمان. تم تجديد جلسة الدخول الحالية.';}catch(error){status.textContent=error.message||'تعذر تحديث كلمة المرور.';}finally{button.disabled=false;}});
document.getElementById('logout').addEventListener('click',async()=>{const button=document.getElementById('logout');button.disabled=true;try{await fetch('/api/auth/logout',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:'{}'});}finally{location.replace('/');}});
})();
</script></body></html>
