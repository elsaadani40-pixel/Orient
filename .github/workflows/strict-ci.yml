name: ORIENT ONE — Strict CI

# Strict gate: every branch change must pass the full compatibility matrix.
# Use the current GitHub-hosted Ubuntu image while preserving every strict check.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit + Architecture Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - name: Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
      - name: Verify SQLite runtime
        shell: bash
        run: |
          set -euo pipefail
          sqlite3 --version
      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e ORIENT-ONE-AUDIT-PACKAGE.md
          test ! -e ORIENT-ONE-AUDIT-PACKAGE-SAFE.md
          ! git ls-files | grep -E '(^|/)(\.env|.*\.pem|.*\.key)$' || {
            echo "Sensitive file tracked"
            exit 1
          }
      - name: Run strict Node test suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find test/unit -type f -name '*.test.js' -print | sort)
          test "${#tests[@]}" -gt 0
          node --test --test-timeout=120000 --test-reporter=spec "${tests[@]}"

  static:
    name: Static Safety Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find src test -type f -name '*.js' -print | sort)
      - name: Reject obvious secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(AIzaSy|ghp_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' -- ':!AGENT.md' ':!.github/workflows/strict-ci.yml'; then
            echo "Potential credential material detected"
            exit 1
          fi

  postgres-integration:
    name: PostgreSQL Integration (Node 20)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orient_test
        options: >-
          --health-cmd "pg_isready -U postgres -d orient_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          check-latest: true
      - name: Install PostgreSQL client dependency
        run: npm install --no-save pg@^8.23.1
      - name: Run PostgreSQL integration suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orient_test
        run: node --test test/integration/postgres-persistence.integration.test.js
