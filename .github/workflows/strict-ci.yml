name: ORIENT ONE — Strict CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit + Architecture Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e ORIENT-ONE-AUDIT-PACKAGE.md
          test ! -e ORIENT-ONE-AUDIT-PACKAGE-SAFE.md
          ! git ls-files | grep -E '(^|/)(\.env|.*\.pem|.*\.key)$' || {
            echo "Sensitive file tracked"
            exit 1
          }

      - name: Run strict Node test suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find test -type f -name '*.test.js' -print | sort)
          test "${#tests[@]}" -gt 0
          node --test --test-reporter=spec "${tests[@]}"

  static:
    name: Static Safety Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find src test -type f -name '*.js' -print | sort)

      - name: Reject obvious secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(AIzaSy|ghp_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' -- ':!AGENT.md'; then
            echo "Potential credential material detected"
            exit 1
          fi
