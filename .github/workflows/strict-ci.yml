name: ORIENT ONE — Strict CI

# Strict gate: every branch change must pass through PR CI; main is also validated directly.
# Keep one active CI generation per PR/branch so stale runs cannot consume the queue.

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: orient-strict-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Mission 8 integration proofs are part of the strict gate.
  unit:
    name: Unit + Architecture Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Install OS sandbox runtime and narrow AppArmor profile
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap apparmor-profiles apparmor-utils
          test -x /usr/bin/bwrap
          test -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --version

      - name: Verify SQLite runtime
        shell: bash
        run: |
          set -euo pipefail
          sqlite3 --version

      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e ORIENT-ONE-AUDIT-PACKAGE.md
          test ! -e ORIENT-ONE-AUDIT-PACKAGE-SAFE.md
          ! git ls-files | grep -E '(^|/)(\\.env|.*\\.pem|.*\\.key)$' || {
            echo "Sensitive file tracked"
            exit 1
          }

      - name: Run strict Node test suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find test/unit -type f -name '*.test.js' -print | sort)
          test "${#tests[@]}" -gt 0
          node --test --test-timeout=120000 --test-reporter=spec "${tests[@]}"

      - name: Run high-risk runtime integration proofs
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-timeout=120000 --test-reporter=spec test/integration/project-audit-mission.test.js
          node --test --test-timeout=120000 --test-reporter=spec test/integration/high-risk-failure-recovery-mission.test.js

  static:
    name: Static Safety Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find src test -type f -name '*.js' -print | sort)

      - name: Reject obvious secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(AIzaSy|ghp_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' -- ':!AGENT.md' ':!.github/workflows/strict-ci.yml'; then
            echo "Potential credential material detected"
            exit 1
          fi

  postgres-integration:
    name: PostgreSQL Integration (Node 20)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orient_test
        options: >-
          --health-cmd "pg_isready -U postgres -d orient_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          check-latest: true

      - name: Install PostgreSQL client dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run PostgreSQL integration suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orient_test
        run: node --test test/integration/postgres-persistence.integration.test.js
