name: ORIENT ONE Android Companion

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-companion.yml"
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android-companion.yml"

permissions:
  contents: read

concurrency:
  group: orient-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify Gradle
        run: gradle --version

      - name: Run Android unit tests and assemble debug APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
