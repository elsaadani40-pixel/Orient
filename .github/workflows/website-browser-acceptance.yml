name: ORIENT — Browser Acceptance

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: orient-browser-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  owner-dashboard-chromium:
    name: Owner Dashboard (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install pinned browser-test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run isolated owner website with temporary credentials
        shell: bash
        env:
          ORIENT_OWNER_BOOTSTRAP_PASSWORD: "temporary-owner-password-9F!x"
          PORT: "8080"
          HOST: "127.0.0.1"
          ORIENT_PERSISTENCE: "json"
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          log_file="$(mktemp)"
          export ORIENT_DATA_DIR="$data_dir"
          node app.js >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            rm -rf "$data_dir" "$log_file"
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8080/auth?mode=owner >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$log_file"
            echo "Owner website failed to become ready"
            exit 1
          fi

          export ORIENT_BASE_URL="http://127.0.0.1:8080"
          node --test --test-timeout=60000 test/browser/owner-dashboard.browser.test.js
