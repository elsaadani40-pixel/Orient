name: ORIENT — Security Evidence (Mutation + Fuzzing)

on:
  pull_request:
    paths:
      - ".github/workflows/security-evidence.yml"
      - "stryker.config.json"
      - "package.json"
      - "package-lock.json"
      - "fuzz/**"
      - "corpus/**"
      - "src/core/security/**"
      - "src/core/runtime/**"
      - "src/core/execution/**"
      - "src/infrastructure/persistence/json/**"
      - "test/unit/core/security/**"
      - "test/unit/core/runtime/**"
      - "test/unit/infrastructure/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/security-evidence.yml"
      - "stryker.config.json"
      - "package.json"
      - "package-lock.json"
      - "fuzz/**"
      - "corpus/**"
      - "src/core/security/**"
      - "src/core/runtime/**"
      - "src/core/execution/**"
      - "src/infrastructure/persistence/json/**"
      - "test/unit/core/security/**"
      - "test/unit/core/runtime/**"
      - "test/unit/infrastructure/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: orient-security-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation — ${{ matrix.name }} (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout || 25 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: owner-auth
            mutate: src/core/security/owner-auth-service.js
            test: test/unit/core/security/owner-auth-service.test.js
          - name: execution-coordinator
            mutate: src/core/runtime/request-execution-coordinator.js
            test: test/unit/core/runtime/request-execution-coordinator.test.js test/unit/core/runtime/coordinator-security-regressions.test.js
          - name: event-repository
            timeout: 60
            mutate: src/infrastructure/persistence/json/event.repository.js
            test: test/unit/infrastructure/event-repository.test.js
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true

      - name: Install locked application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run isolated StrykerJS mutation analysis
        shell: bash
        env:
          MUTATE_FILE: ${{ matrix.mutate }}
          TEST_FILE: ${{ matrix.test }}
        run: |
          set -euo pipefail
          mkdir -p artifacts reports
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('stryker.config.json', 'utf8'));
          config.mutate = [process.env.MUTATE_FILE];
          config.commandRunner.command = `node --test --test-timeout=120000 ${process.env.TEST_FILE}`;
          config.concurrency = 2;
          fs.writeFileSync('stryker.matrix.config.json', JSON.stringify(config, null, 2) + '\n', { mode: 0o600 });
          NODE
          npx --yes --package=@stryker-mutator/core@10.1.1 stryker run stryker.matrix.config.json 2>&1 | tee "artifacts/stryker-${{ matrix.name }}.log"

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orient-stryker-${{ matrix.name }}-evidence
          path: |
            artifacts/stryker-${{ matrix.name }}.log
            reports/**
          if-no-files-found: warn
          retention-days: 30

  fuzz:
    name: Coverage-guided security fuzzing (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true

      - name: Install locked application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install pinned Jazzer.js and run corpus regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/jazzer
          npx --yes --package=@jazzer.js/core@4.0.0 jazzer fuzz/owner-auth.fuzz.js --sync --mode=regression corpus/owner-auth 2>&1 | tee artifacts/jazzer/owner-auth-regression.log
          npx --yes --package=@jazzer.js/core@4.0.0 jazzer fuzz/event-normalize.fuzz.js --sync --mode=regression corpus/event-normalize 2>&1 | tee artifacts/jazzer/event-normalize-regression.log

      - name: Run bounded fuzz campaigns
        shell: bash
        run: |
          set -euo pipefail
          npx --yes --package=@jazzer.js/core@4.0.0 jazzer fuzz/owner-auth.fuzz.js --sync corpus/owner-auth -- -max_total_time=45 -print_final_stats=1 2>&1 | tee artifacts/jazzer/owner-auth-fuzz.log
          npx --yes --package=@jazzer.js/core@4.0.0 jazzer fuzz/event-normalize.fuzz.js --sync corpus/event-normalize -- -max_total_time=45 -print_final_stats=1 2>&1 | tee artifacts/jazzer/event-normalize-fuzz.log

      - name: Upload fuzzing evidence and corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orient-jazzer-fuzz-evidence
          path: |
            artifacts/jazzer/**
            corpus/**
            crash-*
            leak-*
            timeout-*
          if-no-files-found: warn
          retention-days: 30
